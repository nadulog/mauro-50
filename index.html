<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080705" />
    <meta
      name="description"
      content="Los espero para festejar juntos mis 50 años — 21 de noviembre, 21:00 hs."
    />
    <link rel="canonical" href="https://bloomdate-mauro50.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://bloomdate-mauro50.netlify.app/" />
    <meta property="og:title" content="Mauro · Mis 50 años" />
    <meta
      property="og:description"
      content="Los espero para festejar juntos mis 50 años."
    />
    <meta
      property="og:image"
      content="https://bloomdate-mauro50.netlify.app/assets/mauro-50-whatsapp.png"
    />
    <meta property="og:image:width" content="2172" />
    <meta property="og:image:height" content="724" />
    <meta property="og:image:alt" content="Mauro · Mis 50 años" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Mauro · 50 años</title>
    <link rel="preload" as="image" href="assets/portada.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button
      class="audio-toggle"
      type="button"
      aria-label="Reproducir música"
      aria-pressed="false"
    >
      <span class="audio-toggle__icon" aria-hidden="true">♪</span>
    </button>

    <audio id="invitationAudio" autoplay loop preload="auto" playsinline>
      <source src="assets/musica.mp3" type="audio/mpeg" />
    </audio>

    <main class="invitation" aria-label="Invitación al cumpleaños de Mauro">
      <section class="panel panel--hero" aria-label="Mauro cumple 50 años">
        <img
          class="panel__image"
          src="assets/portada.png"
          alt="Mauro, 50 años, con un disco de vinilo negro y dorado"
          width="942"
          height="1677"
        />
        <button class="scroll-cue" type="button" aria-label="Continuar a la cuenta regresiva">
          <span></span>
        </button>
      </section>

      <section class="message-panel" aria-labelledby="warmMessageTitle">
        <p class="message-panel__eyebrow">Una noche para celebrar</p>
        <h2 id="warmMessageTitle">
          Sos parte de mis 50, vení a festejarlo conmigo!!<br />
          Te espero!!
        </h2>
        <span class="message-panel__ornament" aria-hidden="true"></span>
      </section>

      <section class="panel panel--countdown" aria-label="Cuenta regresiva para la fiesta">
        <img
          class="panel__image"
          src="assets/cuenta-regresiva-sin-disco.png"
          alt="Falta poco para el cumpleaños de Mauro"
          width="1122"
          height="1402"
          loading="lazy"
        />
        <div class="countdown" role="timer" aria-live="polite" aria-label="Tiempo restante">
          <span class="countdown__value" data-unit="days">00</span>
          <span class="countdown__value" data-unit="hours">00</span>
          <span class="countdown__value" data-unit="minutes">00</span>
          <span class="countdown__value" data-unit="seconds">00</span>
        </div>
      </section>

      <section class="panel" aria-label="Fecha y hora">
        <img
          class="panel__image"
          src="assets/fecha-calendario.png"
          alt="Agendá la fecha: 21 de noviembre a las 21 horas"
          width="1122"
          height="1402"
          loading="lazy"
        />
        <button class="hotspot hotspot--calendar" type="button" data-action="calendar">
          <span class="sr-only">Agregar el cumpleaños de Mauro al calendario</span>
        </button>
      </section>

      <section class="panel" aria-label="Cómo llegar">
        <img
          class="panel__image"
          src="assets/ubicacion.png"
          alt="Cómo llegar a Mona Eventos, Roca 1932"
          width="1122"
          height="1402"
          loading="lazy"
        />
        <div class="location-details" aria-hidden="true">
          <strong>Mona Eventos</strong>
          <span>Roca 1932</span>
        </div>
        <a
          class="hotspot hotspot--location"
          href="https://maps.app.goo.gl/dNbDuW81eQg53LC47?g_st=iw"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="sr-only">Ver la ubicación de Mona Eventos, Roca 1932, en Google Maps</span>
        </a>
      </section>

      <section class="panel" aria-label="BloomKeep">
        <img
          class="panel__image"
          src="assets/bloomkeep.png"
          alt="BloomKeep: subí tus fotos y dejá tu mensaje"
          width="1122"
          height="1402"
          loading="lazy"
        />
        <a
          class="hotspot hotspot--bloomkeep"
          href="https://app.bloomkeep.site/mauro-50"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="sr-only">Entrar a BloomKeep</span>
        </a>
      </section>

      <section class="panel" aria-label="Confirmación de asistencia">
        <img
          class="panel__image"
          src="assets/confirmacion.png"
          alt="¿Me acompañás? Me encantaría compartir esta noche con vos"
          width="1122"
          height="1402"
          loading="lazy"
        />
        <a class="hotspot hotspot--rsvp" href="#" data-pending="confirmación de asistencia">
          <span class="sr-only">Confirmar asistencia</span>
        </a>
        <p class="rsvp-deadline">Confirmar hasta el 14 de Noviembre</p>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite" aria-hidden="true"></div>
    <script src="script.js"></script>
  </body>
</html>
